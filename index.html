<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toolhand — Enlaces Oficiales</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --th-primary: #1a1f25;
      --th-secondary: #fb2c36;
      --th-whatsapp: #22c55e;
    }
    body {
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      background-color: #1a1f25;
      color: #ffffff;
      letter-spacing: 0.01em;
    }
    .font-brand {
      font-family: 'Montserrat', sans-serif;
      letter-spacing: 0.06em;
    }
    .th-bg-grid {
      background-color: #1a1f25;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(251, 44, 54, 0.20) 0%, transparent 58%),
        radial-gradient(circle at 85% 90%, rgba(251, 44, 54, 0.12) 0%, transparent 45%),
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px;
    }
    .th-card {
      background: rgba(26, 31, 37, 0.88);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.72);
    }
    .btn-whatsapp {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      box-shadow: 0 10px 25px -5px rgba(34, 197, 94, 0.42);
      letter-spacing: 0.03em;
    }
    .btn-whatsapp:hover {
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
      transform: translateY(-2px);
      box-shadow: 0 14px 28px -5px rgba(34, 197, 94, 0.58);
    }
    .btn-website {
      background: linear-gradient(135deg, #fb2c36 0%, #dc2626 100%);
      box-shadow: 0 10px 25px -5px rgba(251, 44, 54, 0.45);
      letter-spacing: 0.03em;
    }
    .btn-website:hover {
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      transform: translateY(-2px);
      box-shadow: 0 14px 28px -5px rgba(251, 44, 54, 0.62);
    }
    .social-square {
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .social-square:hover {
      border-color: #fb2c36;
      background: rgba(251, 44, 54, 0.15);
      transform: translateY(-3px);
      box-shadow: 0 10px 20px -5px rgba(251, 44, 54, 0.32);
    }
  </style>
</head>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 pointer-events-none transition-all duration-300 bg-[#fb2c36] text-white text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl shadow-lg">
    <span id="toastText">Enlace copiado</span>
  </div>

  <script>
    let toastTimeout = null;
    function showNotification(message) {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toastText');
      toastText.textContent = message;
      toast.classList.remove('translate-y-20', 'opacity-0');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2400);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const customLogoImg = document.getElementById('customLogoImg');
      const isoBadgeWrapper = document.getElementById('isoBadgeWrapper');
      const logoUploadInput = document.getElementById('logoUploadInput');
      const btnToggleLogoLayout = document.getElementById('btnToggleLogoLayout');

      let showIsoBadge = true;
      btnToggleLogoLayout.addEventListener('click', () => {
        showIsoBadge = !showIsoBadge;
        isoBadgeWrapper.classList.toggle('hidden', !showIsoBadge);
        showNotification(showIsoBadge ? 'Mostrando isotipo + logotipo horizontal' : 'Mostrando solo logotipo horizontal');
      });

      // Allow user to swap logo image from their device
      logoUploadInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const dataUrl = ev.target.result;
          customLogoImg.src = dataUrl;
          isoBadgeWrapper.classList.remove('hidden');
          showNotification('Logo actualizado correctamente');
        };
        reader.readAsDataURL(file);
      });

      // Copy website URL button
      document.getElementById('btnCopyPageUrl').addEventListener('click', async () => {
        const url = 'https://toolhandmx.com/';
        try {
          await navigator.clipboard.writeText(url);
          showNotification('Enlace https://toolhandmx.com/ copiado');
        } catch (err) {
          const input = document.createElement('textarea');
          input.value = url;
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
          showNotification('Enlace https://toolhandmx.com/ copiado');
        }
      });
    });
  </script>
